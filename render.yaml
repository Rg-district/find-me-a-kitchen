services:
  - type: web
    name: apex-mortgage-agent
    runtime: python
    rootDir: apex-mortgage-agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
