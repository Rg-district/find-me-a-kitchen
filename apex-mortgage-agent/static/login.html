<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAU — Mortgages Are Us</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1b2a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 48px 44px 44px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
  }

  /* MAU Wordmark */
  .wordmark {
    margin-bottom: 32px;
  }
  .wm-text {
    display: block;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 52px;
    font-weight: 700;
    color: #8B1C2A;
    line-height: 1;
    letter-spacing: -1px;
  }
  .wm-rule {
    height: 1.5px;
    background: #8B1C2A;
    margin: 8px auto 7px;
    width: 80%;
    opacity: .55;
  }
  .wm-sub {
    display: block;
    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #8B1C2A;
    font-weight: 600;
  }

  h2 {
    font-size: 15px;
    font-weight: 600;
    color: #1a2a3a;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 13px;
    color: #6b7c93;
    margin-bottom: 28px;
  }

  .field {
    position: relative;
    margin-bottom: 16px;
    text-align: left;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .input-wrap {
    position: relative;
  }
  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 11px 44px 11px 14px;
    border: 1.5px solid #dde2ea;
    border-radius: 7px;
    font-size: 15px;
    color: #1a2a3a;
    background: #f8f9fb;
    outline: none;
    transition: border-color .15s;
  }
  input:focus {
    border-color: #8B1C2A;
    background: #fff;
  }
  .toggle-pw {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #8b9ab0;
    font-size: 15px;
    padding: 2px;
    line-height: 1;
  }
  .toggle-pw:hover { color: #8B1C2A; }

  .error-msg {
    display: none;
    background: #fdf1f2;
    border: 1px solid #f5c6cb;
    color: #8B1C2A;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: left;
  }
  .error-msg.visible { display: block; }

  .btn {
    width: 100%;
    padding: 13px;
    background: #8B1C2A;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    letter-spacing: .03em;
    transition: background .15s;
    margin-top: 8px;
  }
  .btn:hover { background: #a52535; }
  .btn:active { background: #6e1520; }

  .footer-note {
    margin-top: 28px;
    font-size: 11px;
    color: #a0aab8;
  }
  .footer-note strong { color: #6b7c93; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">
    <span class="wm-text">mau</span>
    <div class="wm-rule"></div>
    <span class="wm-sub">mortgages are us</span>
  </div>

  <h2>Consultant Access</h2>
  <p class="subtitle">Enter your dashboard password to continue</p>

  <div id="error-msg" class="error-msg">Incorrect password. Please try again.</div>

  <form method="POST" action="/login">
    <div class="field">
      <label for="pw">Password</label>
      <div class="input-wrap">
        <input type="password" id="pw" name="password" autocomplete="current-password"
               placeholder="••••••••" autofocus required>
        <button type="button" class="toggle-pw" onclick="togglePw()" title="Show / hide password">&#128065;</button>
      </div>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>

  <p class="footer-note"><strong>Mortgages Are Us</strong> &mdash; FCA Authorised Mortgage Intermediary</p>
</div>

<script>
  // Show error if redirected with ?error=1
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('error-msg').classList.add('visible');
  }

  function togglePw() {
    const inp = document.getElementById('pw');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
